workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Set up Environment & Keystore
        script: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
      - name: Locate Project & Build APK
        script: |
          # 1. البحث عن مجلد المشروع
          PROJ_DIR=$(find . -maxdepth 4 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$PROJ_DIR" ]; then
            echo "Error: No build.gradle found!"
            exit 1
          fi
          cd "$PROJ_DIR"

          # 2. تنزيل أداة gradlew تلقائياً إذا كانت مفقودة في GitHub
          if [ ! -f "gradlew" ]; then
            echo "Gradlew not found, generating wrapper..."
            curl -sL "https://raw.githubusercontent.com/gradle/gradle/main/gradlew" -o gradlew
          fi
          chmod +x gradlew

          # 3. البناء
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

          # 4. تجميع الـ APK للتحميل
          mkdir -p $CM_BUILD_DIR/output_apk
          find . -name "*.apk" -exec cp {} $CM_BUILD_DIR/output_apk/ \;
    artifacts:
      - output_apk/*.apk
      - '**/build/outputs/apk/debug/*.apk'
      
