workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Set up Environment & Keystore
        script: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
      - name: Locate Project & Build APK
        script: |
          PROJ_DIR=$(find . -maxdepth 3 -name "build.gradle" -o -name "build.gradle.kts" | head -n 1 | xargs dirname)
          if [ -z "$PROJ_DIR" ]; then PROJ_DIR="."; fi
          cd "$PROJ_DIR"

          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-.*-bin.zip/gradle-9.3.1-bin.zip/g' gradle/wrapper/gradle-wrapper.properties
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

          # نسخ ملف الـ APK إلى مجلد الجذر لضمان التقاطه
          mkdir -p $CM_BUILD_DIR/output_apk
          find . -name "*.apk" -exec cp {} $CM_BUILD_DIR/output_apk/ \;
    artifacts:
      - output_apk/*.apk
      - '**/build/outputs/apk/debug/*.apk'
