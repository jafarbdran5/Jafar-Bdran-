workflows:
  android-build:
    name: Build Android APK
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Set up Environment & Keystore
        script: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
      - name: Upgrade Gradle & Build Debug APK
        script: |
          gradle wrapper --gradle-version 9.3.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
    artifacts:
      - '**/build/outputs/apk/debug/*.apk'
